name: Build

# Every push / PR builds the firmware and keeps the .bin files as a workflow
# artifact. Pushing a tag like v1.2.0 also publishes a GitHub Release and the
# web flasher (GitHub Pages, Settings -> Pages -> Source: GitHub Actions).
#
# One image per board. The NerdQaxe++ builds in build/ and keeps the plain
# axeforge*.bin names; every other board builds in build_<board>/ from
# sdkconfig.defaults.<board> and ships as axeforge-<board>*.bin.
on:
  push:
    branches: [main, master]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: write  # needed to create releases

env:
  BOARDS: nerdaxe nerdqaxeplus nerdoctaxeplus nerdoctaxegamma nerdqx suprahex ultrahex supra gamma naja

jobs:
  # Host-side unit tests (test/): difficulty, coinbase/merkle, template decode,
  # SV2 parsers, payout check. Built with ASan/UBSan; no ESP-IDF needed, so this
  # takes seconds.
  test:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Install compiler, mbedtls and cJSON
        run: sudo apt-get update -qq && sudo apt-get install -y -qq g++ make libmbedtls-dev libcjson-dev
      - name: Run unit tests
        run: make -C test

  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set firmware version
        run: |
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            VERSION="${GITHUB_REF_NAME#v}"
          else
            VERSION="$(cat version.txt | tr -d '[:space:]')-dev.${GITHUB_SHA::7}"
          fi
          echo "$VERSION" > version.txt
          echo "VERSION=$VERSION" >> "$GITHUB_ENV"
          echo "Building AxeForge $VERSION"

      - name: Build with ESP-IDF
        uses: espressif/esp-idf-ci-action@v1
        with:
          esp_idf_version: v5.3.2
          target: esp32s3
          # Output goes to build.log too, for the warning summary below.
          command: |
            set -o pipefail &&
            idf.py build 2>&1 | tee build.log &&
            for b in ${{ env.BOARDS }}; do
              idf.py -B build_$b -D SDKCONFIG=build_$b/sdkconfig \
                -D "SDKCONFIG_DEFAULTS=sdkconfig.defaults;sdkconfig.defaults.$b" build 2>&1 | tee -a build.log || exit 1
            done &&
            for d in build $(for b in ${{ env.BOARDS }}; do echo build_$b; done); do
              (cd $d && esptool.py --chip esp32s3 merge_bin -o axeforge-factory.bin \
                --flash_mode dio --flash_freq 80m --flash_size 16MB \
                0x0 bootloader/bootloader.bin \
                0x8000 partition_table/partition-table.bin \
                0x10000 axeforge.bin \
                0xc10000 ota_data_initial.bin) || exit 1
            done

      - name: Warning summary
        if: always()
        run: |
          grep -hoE '[^ ]+\.(c|cpp|h|inc):[0-9]+:[0-9]+: warning: .*' build.log 2>/dev/null \
            | sed 's|^/github/workspace/||; s|^/project/||' | sort -u > warnings.txt || true
          {
            echo "### Compiler warnings: $(wc -l < warnings.txt)"
            if [ -s warnings.txt ]; then echo '```'; cat warnings.txt; echo '```'; fi
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Collect binaries
        run: |
          mkdir -p dist
          sudo cp build/axeforge-factory.bin dist/axeforge-factory.bin
          sudo cp build/axeforge.bin dist/axeforge.bin
          for b in $BOARDS; do
            sudo cp build_$b/axeforge-factory.bin dist/axeforge-$b-factory.bin
            sudo cp build_$b/axeforge.bin dist/axeforge-$b.bin
          done
          sudo chown -R "$(id -u):$(id -g)" dist
          cd dist && sha256sum *.bin > SHA256SUMS.txt && cat SHA256SUMS.txt

      # The flasher writes the pieces separately so the NVS area (Wi-Fi, pools)
      # is left alone; the merged factory image would blank it.
      - name: Stage web flasher
        run: |
          mkdir -p site
          cp flasher/* site/
          sudo cp build/bootloader/bootloader.bin build/partition_table/partition-table.bin \
                  build/ota_data_initial.bin build/axeforge.bin site/
          for b in $BOARDS; do
            mkdir -p site/$b
            sudo cp build_$b/bootloader/bootloader.bin build_$b/partition_table/partition-table.bin \
                    build_$b/ota_data_initial.bin build_$b/axeforge.bin site/$b/
          done
          sudo chown -R "$(id -u):$(id -g)" site
          sed -i "s/__VERSION__/${VERSION}/g" site/index.html site/manifest-*.json
          ls -laR site

      - name: Upload build artifact
        uses: actions/upload-artifact@v7
        with:
          name: axeforge-${{ env.VERSION }}
          path: dist/*

      - name: Upload flasher for Pages
        if: startsWith(github.ref, 'refs/tags/v')
        uses: actions/upload-pages-artifact@v5
        with:
          path: site

      # RELEASE_NOTES.md holds every release, newest first. The release page
      # gets only this version's "## AxeForge vX.Y.Z" section.
      - name: Release notes for this version
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          awk -v h="## AxeForge v${VERSION}" '/^## /{p = ($0 == h)} p' RELEASE_NOTES.md > dist/release-notes.md
          if [ -s dist/release-notes.md ]; then
            cat dist/release-notes.md
          else
            echo "::warning::RELEASE_NOTES.md has no '## AxeForge v${VERSION}' section; the release gets generated notes only"
            printf 'No release notes were written for this version. See RELEASE_NOTES.md.\n' > dist/release-notes.md
          fi

      - name: Create release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v3
        with:
          name: AxeForge ${{ env.VERSION }}
          generate_release_notes: true
          prerelease: ${{ contains(github.ref_name, '-') }}
          files: |
            dist/*.bin
            dist/SHA256SUMS.txt
          # notes live in their own Markdown file so editing them can't break this YAML
          body_path: dist/release-notes.md

  flasher:
    # pre-releases (tags with a dash) don't replace the public flasher
    if: startsWith(github.ref, 'refs/tags/v') && !contains(github.ref_name, '-')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deploy
        uses: actions/deploy-pages@v5
